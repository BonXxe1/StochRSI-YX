name: after-close-screen

on:
  schedule:
    # 周一至周五 16:10（北京时间）。GitHub 现已支持 IANA timezone。
    - cron: "10 16 * * 1-5"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

# 选股结果需要提交回仓库，因此需要 contents: write。
permissions:
  contents: write

# 防止定时任务与手动任务同时运行、相互覆盖结果。
concurrency:
  group: after-close-screen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset previous status
        run: |
          mkdir -p out
          rm -f out/status.txt

      - name: Time diagnostics
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule || 'workflow_dispatch（手动触发）' }}
        run: |
          echo "触发类型：${GITHUB_EVENT_NAME}"
          echo "计划表达式：${SCHEDULE_EXPR}"
          echo "Runner 北京时间：$(date '+%Y-%m-%d %H:%M:%S %Z %z')"
          echo "Runner UTC：$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Offline self-test
        run: python screen.py --self-test

      - name: Validate Feishu webhook
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "::error::未配置仓库 Secret：FEISHU_WEBHOOK"
            exit 1
          fi

      - name: Run stock screener
        id: screen
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python screen.py

      - name: Job summary
        id: report
        if: always()
        env:
          SCREEN_OUTCOME: ${{ steps.screen.outcome }}
        run: |
          state="$(tr -d '\r\n' < out/status.txt 2>/dev/null || true)"
          if [ -z "$state" ]; then state="missing"; fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

          {
            echo "## 沪深主板 StochRSI 收盘筛选"
            echo
            echo "- 触发方式：${GITHUB_EVENT_NAME}"
            echo "- Runner 北京时间：$(date '+%Y-%m-%d %H:%M:%S %Z %z')"
            echo "- Runner UTC：$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- Python 筛选步骤：${SCREEN_OUTCOME}"
            echo "- 程序状态：${state}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SCREEN_OUTCOME" != "success" ]; then
            echo "本次筛选步骤未成功执行，未上传或提交新结果。" >> "$GITHUB_STEP_SUMMARY"
            if [ -f out/status.txt ]; then
              echo >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat out/status.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          if [ "$state" != "ok" ]; then
            echo "本次未更新结果（例如非交易日、行情未就绪或数据覆盖不足）；保留仓库中的上次有效结果。" >> "$GITHUB_STEP_SUMMARY"
            if [ -f out/status.txt ]; then
              echo >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat out/status.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          for file in out/latest.csv out/summary.json; do
            if [ ! -s "$file" ]; then
              echo "::error::状态为 ok，但缺少有效输出文件：$file"
              exit 1
            fi
          done

          {
            echo "### 本次优选结果（最多显示前 40 只）"
            echo
